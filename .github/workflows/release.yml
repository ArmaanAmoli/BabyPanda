name: Release BabyPanda

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-linux-x64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binary
        run: bun run --filter @baby-panda/cli build-binary

      - name: Smoke-test binary
        run: ./packages/cli/bin/babypanda help

      - name: Package release assets
        run: |
          mkdir -p release
          cp packages/cli/bin/babypanda release/babypanda-linux-x64
          chmod 755 release/babypanda-linux-x64

          cd release
          sha256sum babypanda-linux-x64 > babypanda-linux-x64.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/babypanda-linux-x64
            release/babypanda-linux-x64.sha256
