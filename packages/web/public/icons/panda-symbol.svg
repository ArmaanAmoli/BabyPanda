    <polygon id="left-eye-patch" points="20,25 25,23.5 29,26 31,31 29,36 25,41 20,40 16.5,36 16,31" fill="#090909"/>
    <polygon points="20,25 25,23.5 24,32 16,31" fill="#242424"/>
    <polygon points="25,23.5 29,26 31,31 24,32" fill="#000"/>
    <polygon points="16,31 24,32 25,41 20,40 16.5,36" fill="#111"/>
    <polygon id="right-eye-patch" points="44,25 39,23.5 35,26 33,31 35,36 39,41 44,40 47.5,36 48,31" fill="#050505"/>
    <polygon points="44,25 39,23.5 40,32 48,31" fill="#181818"/>
    <polygon points="39,23.5 35,26 33,31 40,32" fill="#000"/>
    <polygon points="48,31 40,32 39,41 44,40 47.5,36" fill="#090909"/>


    <path d="m32 37-9 5 4 7 5-3 5 3 4-7Z" fill="#f7f7f7"/>
    <path d="m23 42 9 4-5 3Z" fill="#d0d0d0"/>
    <path d="m41 42-9 4 5 3Z" fill="#b3b3b3"/>
