    <path d="m32 11 12 5 7 13-3 14-9 10-7 3-7-3-9-10-3-14 7-13Z" fill="#e8e8e8" stroke="#fff" stroke-opacity="0.62" stroke-width="0.35" stroke-linejoin="miter"/>

    <path d="m32 11-12 5 7 14Z" fill="#fff"/>
    <path d="m32 11 12 5-7 14Z" fill="#d5d5d5"/>
    <path d="m32 11 5 19H27Z" fill="#f4f4f4"/>
    <path d="m20 16-7 13 9 3 5-2Z" fill="#e5e5e5"/>
    <path d="m44 16 7 13-9 3-5-2Z" fill="#b8b8b8"/>
