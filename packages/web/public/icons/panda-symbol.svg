    <path d="m27 39 5-2-1 3Z" fill="#333"/>
    <path d="m32 37 5 2-6 1Z" fill="#171717"/>

  </g>

  <g id="paper-highlights" fill="none" stroke="#fff" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" shape-rendering="geometricPrecision">
    <path d="m20 16 12-5 12 5M13 29l3 14 9 10M25 53l7 3 7-3" stroke-opacity="0.7" stroke-width="0.24"/>
    <path d="m32 11 0 8M25 53l3-4m11 4-3-4" stroke-opacity="0.86" stroke-width="0.22"/>
  </g>
</svg>
